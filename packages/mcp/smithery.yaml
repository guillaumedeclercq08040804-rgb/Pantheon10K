# Smithery configuration for pantheon-10k-mcp
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      pantheonOrigin:
        type: string
        title: "Pantheon Gateway Origin"
        description: "Edge gateway endpoint for the Pantheon-10K swarm (defaults to production)."
        default: "https://pantheon-10k.pseudonyx43.workers.dev"
  commandFunction: |-
    (config) => ({
      command: "node",
      args: ["dist/index.js"],
      env: {
        PANTHEON_ORIGIN: config?.pantheonOrigin || "https://pantheon-10k.pseudonyx43.workers.dev"
      }
    })
